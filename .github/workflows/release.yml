name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships the .deb installer plus an AppImage: the Tauri bundler only emits
          # updater signatures (.sig) for AppImage, so the AppImage is the update channel.
          - platform: linux
            os: ubuntu-latest
            bundle: deb appimage
            artifact: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows
            os: windows-latest
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NPM_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          if [ "$TAG_VERSION" != "$NPM_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json (${NPM_VERSION}) or tauri.conf.json (${TAURI_VERSION}). Bump the versions and re-tag."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify update signing keys
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret missing. Generate one with 'tauri signer generate' and configure it in repository secrets before tagging a release."
            exit 1
          fi
          # The public half is committed in src-tauri/tauri.conf.json and must be the pair of
          # this private key. Rotating the key means updating that public key in the same commit.

      - name: Build desktop bundle with signed update artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CONFIG='{"bundle":{"createUpdaterArtifacts":true}}'
          npm run tauri -- build --bundles ${{ matrix.bundle }} --ci --config "$CONFIG"

      - name: Upload installer and update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-bingbi-${{ matrix.platform }}
          path: |
            ${{ matrix.artifact }}
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only regular files: merged artifacts unpack into directories like deb/ and nsis/.
          ASSETS=$(find release-assets -type f)
          gh release create "${GITHUB_REF_NAME}" ${ASSETS} \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Generate and upload the updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The updater channel points at AppImage on Linux: only AppImage bundles get
          # updater signatures from the Tauri bundler.
          LINUX_APPIMAGE=$(basename release-assets/appimage/*.AppImage)
          LINUX_SIG=$(tr -d '\n' < release-assets/appimage/*.AppImage.sig)
          WINDOWS_EXE=$(basename release-assets/nsis/*.exe)
          WINDOWS_SIG=$(tr -d '\n' < release-assets/nsis/*.exe.sig)
          test -n "$LINUX_SIG"
          test -n "$WINDOWS_SIG"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${LINUX_APPIMAGE}" \
            --arg linux_sig "$LINUX_SIG" \
            --arg windows_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${WINDOWS_EXE}" \
            --arg windows_sig "$WINDOWS_SIG" \
            '{version: $version, pub_date: $pub_date,
              platforms: {
                "linux-x86_64": {url: $linux_url, signature: $linux_sig},
                "windows-x86_64": {url: $windows_url, signature: $windows_sig}
              }}' > latest.json
          jq -e '.version and (.platforms["linux-x86_64"].signature | length > 0) and (.platforms["windows-x86_64"].signature | length > 0)' latest.json > /dev/null
          gh release upload "${GITHUB_REF_NAME}" latest.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
