[package]
name = "odoc-llm"
version = "0.1.0"
description = "Secure OpenAI-compatible and Ollama adapters for Bingbi"
edition = "2024"
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
odoc-model = { path = "../odoc-model" }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "sync", "time"] }
ts-rs = { version = "12.0", features = ["serde-compat"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
