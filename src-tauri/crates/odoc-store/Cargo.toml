[package]
name = "odoc-store"
version = "0.1.0"
description = "SQLite persistence and secure secret storage for Bingbi"
edition = "2024"
rust-version = "1.85"

[dependencies]
directories = "6.0"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
odoc-kb = { path = "../odoc-kb" }
odoc-llm = { path = "../odoc-llm" }
odoc-model = { path = "../odoc-model" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = { version = "11.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true
