[package]
name = "odoc-kb"
version = "0.1.0"
description = "Obsidian knowledge-base providers for Bingbi"
edition = "2024"
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
odoc-llm = { path = "../odoc-llm" }
regex = "1.13"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
tokio = { version = "1.43", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
