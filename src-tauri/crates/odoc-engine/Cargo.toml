[package]
name = "odoc-engine"
version = "0.1.0"
description = "Configurable document drafting orchestration for Bingbi"
edition = "2024"
rust-version = "1.85"

[dependencies]
futures-util = "0.3"
odoc-kb = { path = "../odoc-kb" }
odoc-llm = { path = "../odoc-llm" }
odoc-lint = { path = "../odoc-lint" }
odoc-model = { path = "../odoc-model" }
odoc-pack = { path = "../odoc-pack" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
serde_yaml = "0.9.34"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3.15"
tokio = { version = "1.43", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
