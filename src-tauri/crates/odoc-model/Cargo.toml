[package]
name = "odoc-model"
version = "0.1.0"
description = "Canonical AST for Chinese official documents"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "11.1", features = ["serde-compat"] }
uuid = { version = "1.19", features = ["v4"] }

[lints]
workspace = true
