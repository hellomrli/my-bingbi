[package]
name = "odoc-lint"
version = "0.1.0"
description = "Deterministic rules and fact checks for Bingbi ODocs"
edition = "2024"
rust-version = "1.85"

[dependencies]
odoc-model = { path = "../odoc-model" }
odoc-pack = { path = "../odoc-pack" }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ts-rs = { version = "11.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true
