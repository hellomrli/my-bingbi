[package]
name = "odoc-export"
version = "0.1.0"
description = "Deterministic DOCX export for Bingbi ODocs"
edition = "2024"
rust-version = "1.85"

[dependencies]
cfb = "0.7.3"
calamine = "0.32.0"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
odoc-model = { path = "../odoc-model" }
pdf-extract = "0.12.0"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8.23"
typst = "0.13.1"
typst-pdf = "0.15.1"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
odoc-model = { path = "../odoc-model" }

[lints]
workspace = true
