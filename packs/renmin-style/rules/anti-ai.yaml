- id: slogan-density
  name: 口号密度过高
  severity: warn
  type: lexicon_density
  scope: body.blocks
  lexicon: [走深走实, 提质增效, 凝心聚力, 开拓创新, 真抓实干, 落地见效, 持续发力, 全面推动, 不断完善, 进一步强化]
  max_per_100_chars: 1
  message: 抽象口号密度超标，请替换为主体、任务、机制或时限

- id: vague-actor
  name: 模糊责任主体
  severity: warn
  type: regex
  scope: body.blocks
  pattern: '(相关部门|有关方面|各有关单位)'
  match: forbidden
  message: 责任对象不明确，请写明具体单位或岗位

- id: empty-strengthening
  name: 空泛强化表达
  severity: warn
  type: regex
  scope: body.blocks
  pattern: '(持续|不断|全面|进一步)(强化|提升|推动|完善)'
  match: forbidden
  message: 请补充强化什么、由谁负责以及如何落实

- id: universal-conclusion
  name: 万能结论
  severity: info
  type: regex
  scope: body.blocks
  pattern: '(为.*作出新的更大贡献|谱写.*新篇章|开创.*新局面)'
  match: forbidden
  message: 结尾缺少实指，可删除或改为具体工作安排

- id: parallel-three
  name: 连续三连排比
  severity: warn
  type: structure
  scope: body.blocks
  detect: parallel_phrases
  min_run: 3
  message: 连续排比可能掩盖信息，请确认每项都有独立事实或任务

- id: meta-commentary
  name: 写作过程元话语
  severity: warn
  type: regex
  scope: body.blocks
  pattern: '(下面从|接下来[，、：]|首先[，、：]|其次[，、：]|最后[，、：])'
  match: forbidden
  message: 删除“下面从……展开”“首先/其次/最后”等写作过程提示，直接进入公文内容
