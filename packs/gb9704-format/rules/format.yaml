- id: title-required
  name: 公文标题必填
  severity: error
  type: format
  scope: body.title.text
  required: true
  message: 公文标题不能为空

- id: wenhao-bracket
  name: 发文字号须用六角括号
  severity: error
  type: regex
  scope: header.documentNumber
  pattern: '^.+〔\d{4}〕\d+号$'
  match: required
  when_present: true
  message: 发文字号应使用六角括号〔〕并包含完整年份和序号
  suggestion: 例如：云应急〔2026〕27号

- id: official-date
  name: 成文日期格式
  severity: error
  type: regex
  scope: body.date.value
  # Month-length aware (31/30/28-day groups); leap-year Feb 29 cannot be expressed in a
  # declarative pattern and stays accepted.
  pattern: '^\d{4}年(?:1[02]月(?:3[01]|[12]\d|[1-9])|[13578]月(?:3[01]|[12]\d|[1-9])|[469]月(?:30|[12]\d|[1-9])|11月(?:30|[12]\d|[1-9])|2月(?:2\d|[1-9]))日$'
  match: required
  when_present: true
  message: 成文日期应使用阿拉伯数字全称
  suggestion: 例如：2026年8月12日

- id: halfwidth-punctuation
  name: 中文语境半角标点
  severity: warn
  type: regex
  scope: body.blocks
  pattern: '[一-鿿][,;?!]|[,;?!][一-鿿]'
  match: forbidden
  message: 中文语句应使用全角标点（，。；：？！），不得混用半角逗号句号
  suggestion: 将半角 , ; ? ! 替换为全角 ，；？！等对应标点

- id: doubled-punctuation
  name: 连续重复标点
  severity: warn
  type: regex
  scope: body.blocks
  pattern: '[、，。；：]{2,}'
  match: forbidden
  message: 标点不得连续重复使用
  suggestion: 删除多余的重复标点，保留一个
