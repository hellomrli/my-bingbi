# 人工回归参照用例：尚未接入自动化 runner（pack-test runner 见 docs/PLAN.md 后续规划）。
# 其中文档类型路由类断言依赖模型阶段，无法纯本地判定；lint_rules 类断言可由 odoc-lint 手工复现。
- id: request-has-closing
  doc_type: request
  assert:
    template: templates/request.yaml
    required_closing: 妥否，请批示。
- id: notice-has-execution-fields
  doc_type: notice
  assert:
    template: templates/notice.yaml
    roles: [tasks, requirements, contact]
