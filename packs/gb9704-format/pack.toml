schema_version = "0.1"
# 上游基线：KaguraNanaga/official-document-writing-skill @ e76a6f5（2026-01-26，v1.0）
# 追加吸收：Rimagination/gongwen-draft @ 559d28a（2026-06-29，上游未附许可证；
#   仅吸收标点、易混词与审核方法，文字本地重写）
# 追加吸收：larashero3-dotcom/lieflat-gongwen @ e0a5aba（2026-09-05，PolyForm Noncommercial；
#   仅吸收标题和收尾统计口径，文字本地重写）
# 本包是面向内核提示注入的精简改写，不逐字复制上游长文。

[pack]
id = "gb9704-format"
name = "GB/T 9704-2012 格式规范包"
version = "0.2.0"
description = "公文版式参数与首批确定性格式规则"
license = "MIT"
source = "https://github.com/KaguraNanaga/official-document-writing-skill"

[capabilities]
doc_types = [
  "request", "notice", "report", "letter", "minutes", "summary", "decision",
  "announcement", "regulation", "proclamation", "reply", "instruction", "proposal",
  "work_plan", "work_report", "briefing", "speech", "presentation", "memo",
  "invitation", "certificate", "other"
]
provides = ["format_rules", "templates", "references", "checklists", "style", "tests"]

[[bindings]]
stage = "outline"
inject = [
  "templates/{doc_type}.yaml",
  "templates/announcement-government.yaml",
  "templates/briefing-work.yaml",
  "templates/certificate-employment.yaml",
  "templates/decision-commendation.yaml",
  "templates/instruction-appointment.yaml",
  "templates/invitation-forum.yaml",
  "templates/letter-consultation.yaml",
  "templates/letter-reply.yaml",
  "templates/letter-thanks.yaml",
  "templates/memo-negotiation.yaml",
  "templates/minutes-office.yaml",
  "templates/minutes-special.yaml",
  "templates/notice-appointment.yaml",
  "templates/notice-deployment.yaml",
  "templates/notice-holiday.yaml",
  "templates/notice-meeting.yaml",
  "templates/notice-transmission.yaml",
  "templates/presentation-experience.yaml",
  "templates/proclamation-enforcement.yaml",
  "templates/proposal-bill.yaml",
  "templates/reply-approval.yaml",
  "templates/report-annual.yaml",
  "templates/report-rectification.yaml",
  "templates/report-situation.yaml",
  "templates/request-approval.yaml",
  "templates/request-funding.yaml",
  "templates/speech-mobilization.yaml",
  "templates/speech-summary.yaml",
  "templates/summary-annual.yaml",
  "templates/summary-special.yaml",
  "templates/work_plan-implementation.yaml",
  "templates/work_plan-special.yaml",
  "templates/work_report-annual.yaml",
]

[[bindings]]
stage = "draft"
inject = [
  "references/writing-guidance.md",
  "references/structure.md",
  "references/language.md",
]
retrieval = true

[[bindings]]
stage = "lint"
rules = ["rules/format.yaml"]

[[bindings]]
stage = "export"
styles = ["style/gb9704.toml"]

[[bindings]]
stage = "review"
inject = ["checklists/quality-checklist.md"]
retrieval = true

[[bindings]]
stage = "score"
inject = ["checklists/quality-checklist.md"]
retrieval = true
