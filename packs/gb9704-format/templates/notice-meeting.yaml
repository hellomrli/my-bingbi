id: "notice-meeting"
name: "会议通知"
doc_type: notice
scenario: "召开会议，明确时间地点、参会人员、议题与会议要求"
description: "适用于部署会、推进会、专题会、培训会等会议通知"
required:
  main_recipients: true
blocks:
  - type: paragraph
    role: purpose
    guidance: "交代召开会议的背景、依据和目的，点明会议主题"
  - type: heading
    level: l1
    title: "会议安排"
    role: schedule
  - type: heading
    level: l1
    title: "参会人员"
    role: attendees
  - type: heading
    level: l1
    title: "会议内容"
    role: agenda
  - type: paragraph
    role: requirements
    guidance: "写明报到时间、材料准备、请假和会场纪律要求"
  - type: paragraph
    role: contact
    guidance: "写明联系人、联系电话和报名回执方式"
  - type: paragraph
    role: closing
    content: "特此通知。"
