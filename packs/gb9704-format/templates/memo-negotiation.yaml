id: "memo-negotiation"
name: "会谈备忘录"
doc_type: memo
scenario: "记录会谈已确认事项、共识和后续安排"
description: "适用于合作洽谈、工作对接、来访会谈"
required:
  main_recipients: true
blocks:
  - type: paragraph
    role: overview
    guidance: "写明会谈时间、地点、双方人员和议题"
  - type: heading
    level: l1
    title: "达成的共识"
    role: consensus
  - type: heading
    level: l1
    title: "后续安排"
    role: next_steps
  - type: paragraph
    role: closing
    guidance: "只写已确认事项，未确认内容列入待定"
