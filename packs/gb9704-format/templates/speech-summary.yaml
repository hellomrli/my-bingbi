id: "speech-summary"
name: "总结讲话"
doc_type: speech
scenario: "在会议结束时总结成果、提炼经验并部署后续工作"
description: "适用于工作会、推进会、培训班的总结讲话"
required:
  main_recipients: true
blocks:
  - type: paragraph
    role: salutation
    guidance: "简要回应会议主题和参会对象"
  - type: heading
    level: l1
    title: "会议取得的成果"
    role: results
  - type: heading
    level: l1
    title: "需要把握的重点"
    role: requirements
  - type: heading
    level: l1
    title: "下一步工作要求"
    role: next_steps
  - type: paragraph
    role: closing
    guidance: "简短有力，落到具体行动"
